# Example, included at server level: the challenge is off here and switched on where needed
# ("location / { testcookie on; }"), or by a script for the time of an attack.
# It needs this fork's master; the files of this folder go to /etc/nginx/testcookie/.
#
# To pass, a client runs pow.html: the page does a proof of work (18 bits, under 0.1 s in a browser on a
# laptop; phones were not measured) and sets the cookie, which is signed and passes for one hour.
#
# Put your own secret here, nginx does not start with this one:  openssl rand -hex 32
testcookie off;
testcookie_name RCPC;                   # the same name as in pow.html
testcookie_secret CHANGE_ME;
# To change the secret without challenging everyone again, keep the old one here for one lifetime:
#testcookie_previous_secret <the old secret>;
testcookie_session $remote_addr;
testcookie_arg attempt;
testcookie_max_attempts 3;
# POST is not challenged: a browser would lose its body. A login form is a GET page first, so
# "testcookie_get_only off" in the location of the form challenges a script that only POSTs.
testcookie_get_only on;

# The cookie carries its expiry: one solved challenge passes for an hour, not until the secret changes.
testcookie_lifetime 1h;

# The work, 0 to 32 bits: every bit doubles it. Or a variable from a map or geo at http level,
# to ask more of some networks or during an attack: testcookie_pow $pow_bits;
testcookie_pow 18;

# The page that does the work. It sets the cookie itself, there is no Set-Cookie.
testcookie_redirect_via_refresh on;
testcookie_refresh_template_file /etc/nginx/testcookie/pow.html;

# pow.html carries a decoy ($testcookie_decoy) where a browser never runs it. A script that reads the
# page by pattern finds it first and sends it back; a browser never does. In the location with
# "testcookie on":
#     if ($testcookie_trapped = 1) { return 444; }
# or keep the addresses for a ban:
#     access_log /var/log/nginx/testcookie-trapped.log combined if=$testcookie_trapped;
# Move the decoy in the page now and then.

testcookie_whitelist {
	# Yandex
	77.88.0.0/18;
	87.250.224.0/19;
	# Google
	64.233.160.0/19;
	66.102.0.0/20;
	66.249.64.0/19;
	72.14.192.0/18;
	74.125.0.0/16;
	209.85.128.0/17;
	216.239.32.0/19;
	8.8.8.8/32;
}
