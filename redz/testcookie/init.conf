# Example, included at server level: the challenge is off here and switched on where needed
# ("location / { testcookie on; }"), or by a script for the time of an attack.
# Generate your own values, never reuse the ones below:
#   testcookie_secret                      openssl rand -hex 32
#   testcookie_refresh_encrypt_cookie_key  openssl rand -hex 16
#   testcookie_refresh_encrypt_cookie_iv   openssl rand -hex 16  (a different value from the key)
testcookie off;
testcookie_name RCPC;
testcookie_secret 1ed17d9ec74ff3d08b37a1905bd808b9448457335fadc1c4801d980733632785;
testcookie_session $remote_addr;
testcookie_arg attempt;
testcookie_max_attempts 3;
testcookie_get_only on;
testcookie_redirect_via_refresh on;
testcookie_refresh_encrypt_cookie on;
testcookie_refresh_encrypt_cookie_key 3d09549c7cb0122ed71f78ea242a8d81;
testcookie_refresh_encrypt_cookie_iv 3d09549c7cb0222ed71f78ea242a8d82;
testcookie_whitelist {
	# Yandex
	77.88.0.0/18;
	87.250.224.0/19;
	# Google
	64.233.160.0/19;
	66.102.0.0/20;
	66.249.64.0/19;
	72.14.192.0/18;
	74.125.0.0/16;
	209.85.128.0/17;
	216.239.32.0/19;
	8.8.8.8/32;
}
testcookie_refresh_template '<html><body>Anti DDoS checking...<script type=\"text/javascript\" src=\"/aes.min.js\" ></script><script>function toNumbers(d){var e=[];d.replace(/(..)/g,function(d){e.push(parseInt(d,16))});return e}function toHex(){for(var d=[],d=1==arguments.length&&arguments[0].constructor==Array?arguments[0]:arguments,e="",f=0;f<d.length;f++)e+=(16>d[f]?"0":"")+d[f].toString(16);return e.toLowerCase()}var a=toNumbers("$testcookie_enc_key"),b=toNumbers("$testcookie_enc_iv"),c=toNumbers("$testcookie_enc_set");document.cookie="RCPC="+toHex(slowAES.decrypt(c,2,a,b))+"; path=/";document.location.href="$testcookie_nexturl";</script></body></html>';

location = /aes.min.js {
    # the script that solves the challenge must never be challenged itself
    testcookie off;
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain;
    gzip_static on;
    root /etc/nginx/testcookie;
}